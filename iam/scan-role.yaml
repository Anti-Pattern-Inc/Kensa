AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  kensa: a read-only role for scanning an AWS account (ReadOnlyAccess + SecurityAudit + an explicit Deny on
  reading secret and data values), and an optional, separate role that can write only to the Well-Architected Tool.
  Read it before you deploy it. Nothing here creates users, access keys or anything outside these roles.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Who may assume the roles}
        Parameters: [TrustedPrincipalArnPattern, TrustedAccountId]
      - Label: Well-Architected Tool role (optional, can write)
        Parameters: [CreateWaToolRole, WaToolTrustedPrincipalArnPattern]
      - Label: Names
        Parameters: [ScanRoleName, WaToolRoleName]

Parameters:
  TrustedPrincipalArnPattern:
    Type: String
    AllowedPattern: '^arn:aws:(iam|sts)::[0-9]{12}:.+$'
    ConstraintDescription: "Must start with arn:aws:iam::<12-digit account>: (for example arn:aws:iam::123456789012:user/alice)"
    Description: >-
      Which principals in the trusted account may assume the scan role (matched with aws:PrincipalArn, ArnLike).
      Be as narrow as you can. Examples - an IAM Identity Center (SSO) permission set:
      arn:aws:iam::123456789012:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_PowerUserAccess_*
      or one IAM user: arn:aws:iam::123456789012:user/alice
  TrustedAccountId:
    Type: String
    Default: ""
    AllowedPattern: '^([0-9]{12})?$'
    ConstraintDescription: "Must be a 12-digit account ID, or empty"
    Description: >-
      The account that holds the principals above. Leave empty when they are in this same account.
      Set it when you sign in to a different (for example a management or identity) account.
  CreateWaToolRole:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" also creates a second role that can create Well-Architected Tool workloads and write answers
      (the actions of `kensa.py iam-policy --kind wa-tool-write`). It cannot read or change anything else.
      Keeping it separate means the scan role never holds a write permission.
  WaToolTrustedPrincipalArnPattern:
    Type: String
    Default: ""
    AllowedPattern: '^(arn:aws:(iam|sts)::[0-9]{12}:.+)?$'
    ConstraintDescription: "Must start with arn:aws:iam::<12-digit account>:, or be empty"
    Description: Who may assume the Well-Architected Tool role. Empty means the same pattern as the scan role.
  ScanRoleName:
    Type: String
    Default: KensaScanRole
  WaToolRoleName:
    Type: String
    Default: KensaWaToolRole

Conditions:
  HasTrustedAccount: !Not [!Equals [!Ref TrustedAccountId, ""]]
  HasWaToolPattern: !Not [!Equals [!Ref WaToolTrustedPrincipalArnPattern, ""]]
  WithWaToolRole: !Equals [!Ref CreateWaToolRole, "true"]

Resources:
  ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ScanRoleName
      Description: kensa read-only scan role (ReadOnlyAccess + SecurityAudit + Deny on known value/content reads; not exhaustive)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${Account}:root"
                - Account: !If [HasTrustedAccount, !Ref TrustedAccountId, !Ref "AWS::AccountId"]
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Ref TrustedPrincipalArnPattern
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"
      Policies:
        - PolicyName: KensaDenySecretAndDataReads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KensaDenySecretAndDataReads
                Effect: Deny
                Resource: "*"
                Action:
                  # BEGIN generated by: kensa.py iam-policy --kind scan-deny   (tests/test_kensa.py keeps it identical)
                  - athena:GetQueryResults
                  - cloudformation:GetTemplate
                  - codebuild:BatchGetBuilds
                  - codecommit:GetBlob
                  - codecommit:GetFile
                  - codecommit:GitPull
                  - dynamodb:BatchGetItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - ec2:GetConsoleOutput
                  - ec2:GetPasswordData
                  - ecr:GetAuthorizationToken
                  - ecr:GetDownloadUrlForLayer
                  - iam:GetCredentialReport
                  - kinesis:GetRecords
                  - kms:Decrypt
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lightsail:GetInstanceAccessDetails
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:GetLogRecord
                  - logs:GetQueryResults
                  - logs:StartQuery
                  - redshift-serverless:GetCredentials
                  - redshift:GetClusterCredentials
                  - redshift:GetClusterCredentialsWithIAM
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - secretsmanager:BatchGetSecretValue
                  - secretsmanager:GetSecretValue
                  - sqs:ReceiveMessage
                  - ssm:GetParameter
                  - ssm:GetParameterHistory
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - states:GetExecutionHistory
                  # END generated

  WaToolRole:
    Type: AWS::IAM::Role
    Condition: WithWaToolRole
    Properties:
      RoleName: !Ref WaToolRoleName
      Description: kensa role that can write only to the Well-Architected Tool
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${Account}:root"
                - Account: !If [HasTrustedAccount, !Ref TrustedAccountId, !Ref "AWS::AccountId"]
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !If [HasWaToolPattern, !Ref WaToolTrustedPrincipalArnPattern, !Ref TrustedPrincipalArnPattern]
      Policies:
        - PolicyName: KensaWellArchitectedToolWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KensaWellArchitectedToolWrite
                Effect: Allow
                Resource: "*"   # CreateWorkload has no resource to scope to; narrow the others to your workload ARN once it works
                Action:
                  # BEGIN generated by: kensa.py iam-policy --kind wa-tool-write   (tests/test_kensa.py keeps it identical)
                  - wellarchitected:CreateMilestone
                  - wellarchitected:CreateWorkload
                  - wellarchitected:GetLensReview
                  - wellarchitected:GetLensReviewReport
                  - wellarchitected:GetWorkload
                  - wellarchitected:ListAnswers
                  - wellarchitected:UpdateAnswer
                  # END generated

Outputs:
  ScanRoleArn:
    Value: !GetAtt ScanRole.Arn
  ScanProfileSnippet:
    Description: Paste into ~/.aws/config, then `kensa.py context set aws.profile=kensa-scan`. Replace YOUR_BASE_PROFILE with the profile you sign in with (an SSO profile is best - no long-lived keys).
    Value: !Sub |
      [profile kensa-scan]
      role_arn = ${ScanRole.Arn}
      source_profile = YOUR_BASE_PROFILE
      region = ap-northeast-1
  WaToolRoleArn:
    Condition: WithWaToolRole
    Value: !GetAtt WaToolRole.Arn
  WaToolProfileSnippet:
    Condition: WithWaToolRole
    Description: Paste into ~/.aws/config, then `kensa.py context set aws.wa_profile=kensa-wa`.
    Value: !Sub |
      [profile kensa-wa]
      role_arn = ${WaToolRole.Arn}
      source_profile = YOUR_BASE_PROFILE
      region = ap-northeast-1
